<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self'" />
  <title>Overlay Assistant — Activation</title>
  <link rel="stylesheet" href="settings.css" />
</head>
<body>
  <main>
    <section>
      <h1>Device Activation Required</h1>
      <p class="hint">
        Each installation is locked to this computer. Request access below so the owner can approve your device.
      </p>

      <h2>Your Device ID</h2>
      <div class="row">
        <input id="device-id" type="text" readonly spellcheck="false" />
        <button type="button" id="copy-id">Copy</button>
      </div>

      <h2>Your Name or Email</h2>
      <form id="req-form" class="row">
        <input id="name" type="text" placeholder="Enter your name so the owner knows who this is" required />
        <button id="req-btn" class="primary">Request Access</button>
      </form>

      <div class="row">
        <button type="button" id="check-btn">Check Approval</button>
        <span id="status" class="hint"></span>
      </div>
    </section>
  </main>
  <script type="module" src="activate.js"></script>
</body>
</html>
